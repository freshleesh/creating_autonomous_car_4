/**:
  ros__parameters:

    # ---- topics ------------------------------------------------------------
    scan_topic:       /scan
    odom_topic:       /vesc/odom            # real car: /car_state/odom
    global_topic:     /global_waypoints     # reference line (preferred)
    centerline_topic: /centerline_waypoints # reference line (fallback)
    detections_topic: /detections           # consumed by MPPI when use_detection:=true
    markers_topic:    /detection_sh/markers

    # ---- range gate --------------------------------------------------------
    r_min:  0.05    # [m] drop returns closer than this
    r_max:  10.0    # [m] drop returns farther than this

    # ---- reference-line proximity ------------------------------------------
    ref_dist_thresh: 0.2    # [m] keep points within this of the reference line
    laser_to_base_x: 0.27   # [m] MUST match MPPI laser_x_offset

    # ---- output shaping ----------------------------------------------------
    sort_by_range: true   # nearest-first (so MPPI's max_obstacles cap keeps closest)
    max_obstacles: 0      # 0 = publish all survivors; >0 caps the count here
    obstacle_size: 0.05   # [m] reported Obstacle.size (MPPI ignores it)

    # ---- visualization -----------------------------------------------------
    publish_markers: true # /detection_sh/markers (cyan spheres, map frame)
    marker_size:     0.3  # [m] RViz sphere size (bigger than v1)

/**:
  ros__parameters:
    wheelbase: 0.33
    scan_topic: 'scan'
    odometry_topic: 'vesc/odom'

urg_node:
  ros__parameters:
    angle_max: 3.14
    angle_min: -3.14
    ip_address: "192.168.0.10"
    ip_port: 10940
    laser_frame_id: "laser"
    calibrate_time: false
    default_user_latency: 0.0
    diagnostics_tolerance: 0.05
    diagnostics_window_time: 5.0
    error_limit: 4
    get_detailed_status: false
    publish_intensity: true
    publish_multiecho: false
    cluster: 1
    skip: 0

vesc/**:
  ros__parameters:
    port: "/dev/ttyACM0"
    publish_tf: false
    brake_max: 200000.0
    brake_min: -20000.0
    current_max: 100.0
    current_min: 0.0
    duty_cycle_max: 0.0
    duty_cycle_min: 0.0
    position_max: 0.0
    position_min: 0.0
    servo_max: 1.0
    servo_min: 0.0
    speed_max: 140000.0   # [user] 46140→140000: 기존 캡이 실게인(7382.4) 기준 6.25 m/s에서 잘려
                          #   직선속도를 막고 있었음. 140000/7382.4 ≈ 명령 19 m/s(실제 ÷1.6 ≈ 11.8 m/s)까지 허용.
                          #   ⚠️ 모터 안전 상한 — 벤치에서 과회전 여부 확인 권장.
    speed_min: -140000.0
    speed_to_erpm_gain: 7382.4
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -1.2 #-1.2135
    steering_angle_to_servo_offset: 0.634
    use_servo_cmd_to_calc_angular_velocity: true

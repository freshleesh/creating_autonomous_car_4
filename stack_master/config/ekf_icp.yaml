ekf_localization:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true          # EKF owns map→base_link (single TF writer); launch sets false in sim (gym_bridge owns it)

    # world_frame=map with odom_frame=base_link makes robot_localization broadcast
    # map→base_link directly (the odom→base_link lookup is identity), so the TF in
    # RViz equals the fused /car_state/odom the controller drives on.
    odom_frame:      base_link
    base_link_frame: base_link
    world_frame:     map       # absolute pose in map frame

    # VESC wheel odometry: use twist only (vx, vyaw)
    odom0: /vesc/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false

    # ICP scan-match pose: use position + yaw
    odom1: /icp/pose/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false

local_planning:
  ros__parameters:

    # ---- mode --------------------------------------------------------------
    # free          : raceline forward window only
    # trailing      : raceline + trailing PD speed cap
    # spline_avoid  : left/right spline candidates; trailing fallback
    mode: trailing

    # ---- topics ------------------------------------------------------------
    scan_topic:   /scan
    odom_topic:   /vesc/odom        # launch overrides to /car_state/odom on real car
    global_topic: /global_waypoints
    local_topic:  /local_waypoints

    # ---- forward window (Frenet slice) -------------------------------------
    local_horizon: 5.0     # [m]  total length of published waypoints
    ds_step:       0.25    # [m]  spacing between samples
    s_blend:       3.0     # [m]  cosine blend distance (~ 2 * pp_lookahead)

    # ---- spline_avoid: avoidance geometry ----------------------------------
    d_safe:        0.40    # [m]  peak lateral offset — 장애물 40cm 회피 (25cm 최소 보장)
    s_in:          0.3     # [m]  min approach gap; closer than this -> free
    s_out:         1.5     # [m]  distance from peak back to raceline rejoin
    trigger_range: 5.0     # [m]  start considering avoidance within this gap
    margin:        0.05    # [m]  evaluate 기준 (실질 벽 마진은 PNG 15cm가 담당)
    obs_radius:    0.05    # [m]  safety = 0.10m (lenient — 미드포인트가 실질 이격 보장)
    track_half_w:  0.8     # [m]  fallback track half-width if CSV lacks dl/dr

    # ---- trailing (감속 + 정지, ramp) + 시야(FOV) --------------------------
    # 상대가 전방 시야(±fov/2, detect_range 이내)에 들어오면 속도를 선형 감속,
    # stop_gap 이내면 완전 정지. 상대 없으면 캡 없음(레이스라인 속도 그대로).
    trailing_detect_range: 5.0    # [m]    이 거리부터 감속 시작 (속도 = max_speed)
    trailing_stop_gap:     3.0    # [m]    이 거리 이내 → 완전 정지 (속도 = 0)
    trailing_max_speed:    6.0    # [m/s]  감속 시작 시점 속도 상한 (ramp 천장)
    trailing_kd:           4.0    # 접근(closing) 속도당 추가 감속 gain
    trailing_fov_deg:      60.0   # [deg]  전체 시야각 (±30°); 이 밖의 상대는 무시

    # ---- spline_avoid: speed limits ----------------------------------------
    vx_max:         15.0    # [m/s]   전체 속도 상한
    a_lat_max:      7.0    # [m/s^2] lateral accel cap (curvature-based vx cap)
    vx_scale_avoid: 0.85   # [-]     speed multiplier while on avoidance spline

    # ---- spline_avoid: wall clamping (forces wall feasibility) -------------
    clamp_to_walls:  true   # [bool] enable clamp + PCHIP smoothing
    clamp_buffer:    0.05   # [m]    inset = margin + clamp_buffer = 0.25m
    s_hold:          0.4    # [m]    이 거리까지 현재 경로 유지 후 회피 시작

